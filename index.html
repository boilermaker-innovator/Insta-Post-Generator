<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>iTabs | Claude Opus 4.6 Agent Teams Explained</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --i-button: #f59e0b;
            --i-button-hover: #d97706;
            --card-radius: 16px;
            --transition: 0.2s ease;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .container {
            max-width: 430px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-primary);
        }

        /* Progress Bar */
        .progress-container {
            display: flex;
            gap: 4px;
            padding: 12px 16px 8px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        .progress-segment {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-segment.active {
            background: var(--text-primary);
        }

        .progress-segment.viewed {
            background: var(--text-primary);
        }

        /* Header */
        .header {
            padding: 48px 16px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .header-info {
            flex: 1;
        }

        .channel-name {
            font-size: 14px;
            font-weight: 600;
        }

        .video-title {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Cards Container */
        .cards-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .card {
            position: absolute;
            inset: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateX(100%);
            transition: transform 0.3s ease, opacity 0.3s ease;
            pointer-events: none;
        }

        .card.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .card.prev {
            transform: translateX(-100%);
        }

        .card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-radius: var(--card-radius);
            overflow: hidden;
        }

        .card-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background: var(--bg-tertiary);
            position: relative;
            overflow: hidden;
        }

        .card-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .timestamp-badge {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.8);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition);
            text-decoration: none;
            color: var(--text-primary);
        }

        .timestamp-badge:hover {
            background: var(--accent);
        }

        .card-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-number {
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-headline {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .card-summary {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
            flex: 1;
        }

        /* i-Buttons */
        .i-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .i-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-tertiary);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: background var(--transition);
        }

        .i-button:hover {
            background: rgba(245, 158, 11, 0.2);
        }

        .i-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--i-button);
            color: #000;
            font-size: 12px;
            font-weight: 700;
            font-style: italic;
            font-family: Georgia, serif;
        }

        /* Navigation */
        .nav-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 30%;
            z-index: 50;
            cursor: pointer;
        }

        .nav-zone.left {
            left: 0;
        }

        .nav-zone.right {
            right: 0;
        }

        /* Bottom Bar */
        .bottom-bar {
            padding: 12px 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .watch-button {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            background: var(--accent);
            border-radius: 12px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: background var(--transition);
        }

        .watch-button:hover {
            background: var(--accent-hover);
        }

        .skill-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 16px;
            background: var(--bg-tertiary);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 12px;
            color: var(--i-button);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            white-space: nowrap;
        }

        .skill-button:hover {
            background: rgba(245, 158, 11, 0.15);
            border-color: var(--i-button);
        }

        .skill-icon {
            font-size: 16px;
        }

        /* Swipe Hint */
        .swipe-hint {
            text-align: center;
            padding: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            animation: pulse 2s ease-in-out infinite;
        }

        .swipe-hint.hidden {
            display: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--bg-secondary);
            max-width: 430px;
            width: 100%;
            border-radius: 20px 20px 0 0;
            padding: 24px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            max-height: 70vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .modal-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-title span:first-child {
            font-weight: 600;
            font-size: 18px;
        }

        .type-badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-weight: 500;
        }

        .modal-close {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-primary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="progress-container" id="progress"></div>

        <div class="header">
            <div class="channel-avatar" id="channelAvatar"></div>
            <div class="header-info">
                <div class="channel-name" id="channelName"></div>
                <div class="video-title" id="videoTitle"></div>
            </div>
        </div>

        <div class="cards-wrapper" id="cardsWrapper">
            <div class="nav-zone left" id="navLeft"></div>
            <div class="nav-zone right" id="navRight"></div>
        </div>

        <div class="swipe-hint" id="swipeHint">← Swipe or tap edges to navigate →</div>

        <div class="bottom-bar">
            <a class="watch-button" id="watchButton" target="_blank">
                ▶ Watch Full Video
            </a>
            <button class="skill-button" id="skillButton" title="Download the iTabs Skill for Claude">
                <span class="skill-icon">⚡</span> Get Skill
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">
                    <span id="modalTerm"></span>
                    <span class="type-badge" id="modalType"></span>
                </div>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-content" id="modalContent"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // VIDEO DATA
        // ============================================
        const VIDEO_DATA = {
            title: "Claude Opus 4.6 Agent Teams Explained",
            videoId: "placeholder",
            channelName: "Turing College",
            cards: [
                {
                    headline: "One Task, Many Agents",
                    summary: "Agent Teams let you describe a complex task and Claude automatically spawns multiple specialized agents that coordinate to solve it. Instead of one AI doing everything, you get a research agent, strategy agent, creative agent and review agent — all working together.",
                    timestamp: "0:00",
                    timestampSeconds: 0,
                    iButtons: [
                        {type: "definition", term: "Agent Teams", content: "A new feature in Claude Opus 4.6 (released Feb 5, 2026) that spawns multiple specialized AI agents from a single prompt. Each agent handles a distinct part of the task while a supervisor coordinates the overall workflow. Currently available as a Research Preview in Claude Code."},
                        {type: "context", term: "Claude Opus 4.6", content: "Anthropic's most advanced AI model, released February 5, 2026. It features a 1M token context window (beta), 128K output tokens, adaptive thinking mode, and agent teams. It leads benchmarks on Terminal-Bench 2.0, Humanity's Last Exam, and BrowseComp."}
                    ]
                },
                {
                    headline: "Teams vs Sub-Agents",
                    summary: "Unlike sub-agents which only report results back to the main agent, team members can communicate with each other directly. You can also interact with individual teammates — stopping them, course-correcting, or assigning new tasks mid-flow.",
                    timestamp: "0:39",
                    timestampSeconds: 39,
                    iButtons: [
                        {type: "definition", term: "Sub-Agents", content: "The previous approach to multi-agent work in Claude Code. Sub-agents operate within one session and only communicate their results back to the main agent. You can't observe or interact with individual sub-agents the way you can with teammates."},
                        {type: "why-it-matters", content: "Direct teammate interaction is a game-changer. If the writing agent needs more data, it can ask the research agent directly instead of routing through a lead. You can also monitor each agent's progress in real-time using tmux split panes."}
                    ]
                },
                {
                    headline: "Specialists Beat Generalists",
                    summary: "A single AI has to be a generalist — okay at everything but not great at anything. When you specialize agents, each one is optimized for its specific task. The research agent excels at research, the creative agent excels at writing, and together they outperform any solo AI.",
                    timestamp: "1:23",
                    timestampSeconds: 83,
                    iButtons: [
                        {type: "why-it-matters", content: "This represents a fundamental shift in AI. Instead of making one model smarter with more parameters and data, you get a coordinated organization of specialists. Tasks that were too complex for a single AI — long-horizon projects, multi-step workflows — just became possible."},
                        {type: "context", term: "Parallel Execution", content: "Agents work simultaneously where they can and sequentially where they need to. A supervisor agent coordinates everything, making sure agents work in the right order and don't duplicate effort. This means complex projects finish way faster."}
                    ]
                },
                {
                    headline: "What Claude Got Right",
                    summary: "Four things make this production-ready: automatic orchestration (Claude figures out what agents are needed), intelligent coordination (agents share context naturally), built-in specializations (pre-configured agent types), and error handling (agents catch each other's mistakes).",
                    timestamp: "2:56",
                    timestampSeconds: 176,
                    iButtons: [
                        {type: "definition", term: "Automatic Orchestration", content: "You don't manually spawn agents. Describe your task and Claude determines which specialists are needed. In the demo, asking for social media content automatically created a strategist, copywriter, visual concept agent, and reviewer."},
                        {type: "context", term: "First Production-Ready Version", content: "Multi-agent systems aren't new — people have been experimenting with them for a while. But Claude Opus 4.6 is the first implementation that feels production-ready, with proper coordination, specialization, and error handling built in. Anthropic even used 16 parallel agents to write a 100,000-line C compiler in just two weeks."}
                    ]
                },
                {
                    headline: "Setup: Claude Code + Tmux",
                    summary: "You need Claude Code with the experimental agent teams flag enabled in your settings.json. Install tmux to see each agent working in its own panel — this lets you observe, interact with, and course-correct individual teammates in real time.",
                    timestamp: "4:43",
                    timestampSeconds: 283,
                    iButtons: [
                        {type: "definition", term: "Tmux", content: "A terminal multiplexer that lets you split your terminal into multiple panes. With agent teams, each spawned agent gets its own tmux pane so you can watch them all work simultaneously. Without tmux, you'd only see agents in a single conversation stream."},
                        {type: "context", term: "Configuration", content: "Navigate to ~/.claude/, open settings.json, and add the experimental agent teams flag. You'll need a Claude Pro subscription (sufficient for 2-3 tasks/day) or Max plan ($100-200/month) for professional use. Launch Claude Code from a project folder for best results."}
                    ]
                },
                {
                    headline: "Demo: A Week of Content in 15 Minutes",
                    summary: "A strategist agent planned the campaign, a copywriter created platform-specific posts for LinkedIn, Twitter and Instagram, a visual concept agent designed image and video briefs, and a reviewer flagged quality issues — all from a single prompt.",
                    timestamp: "5:57",
                    timestampSeconds: 357,
                    iButtons: [
                        {type: "why-it-matters", content: "The output included platform-optimized posts (LinkedIn style with metrics, short Twitter posts with hashtags, Instagram captions), image concepts with color schemes and exact resolutions, and video scripts broken down second-by-second. A single AI couldn't hold enough context to cover every day, every post, and every platform this thoroughly."},
                        {type: "context", term: "Iterative Refinement", content: "After the first pass, the reviewer flagged 5 action items. Prompting the team lead to address these spawned NEW agent types — a researcher and copy editor — that weren't in the original prompt. The researcher even verified statistics online and created a sources document."}
                    ]
                },
                {
                    headline: "It Costs ~$8 Per Run",
                    summary: "The social media demo cost about $7-8 in API usage — roughly 50% of a Pro plan's single session limit. On Max, you'd fit about 8-10 tasks in a five-hour window. Don't use agent teams for simple tasks — save them for multi-component projects where quality matters.",
                    timestamp: "14:45",
                    timestampSeconds: 885,
                    iButtons: [
                        {type: "context", term: "When to Use Teams", content: "Use agent teams when: the task has multiple distinct components (research + writing + review), quality matters more than speed, you need different expertise on different parts, and you want built-in QA. Use a single AI for focused tasks, when speed trumps sophistication, or when budget is tight."},
                        {type: "why-it-matters", content: "Despite the cost, 15 minutes for a production-ready content package that would take hours manually is a strong trade-off. The key insight: keep single-agent Claude for quick tasks and only spin up teams for complex projects where a solo agent would fail or require multiple tries."}
                    ]
                },
                {
                    headline: "Tips Before You Start",
                    summary: "Start with a low-stakes project — not your most important client work. Be specific in your brief (brand voice, audience, goals). Review everything — agents aren't infallible. And monitor your usage dashboard closely to avoid surprise costs.",
                    timestamp: "16:18",
                    timestampSeconds: 978,
                    iButtons: [
                        {type: "context", term: "Prompting Strategy", content: "Specify the individual team roles you want (strategist, copywriter, reviewer, etc.) for consistent results. You can also let Claude decide which agents to spawn — it will adapt. In the demo, Claude autonomously added a researcher and copy editor on the second iteration."},
                        {type: "why-it-matters", content: "Agent teams represent the shift from 'AI as a tool' to 'AI as a workforce.' This is the first step toward AI organizations that handle complex projects autonomously. As the presenter puts it: specialized AIs working together beat one generalist AI — and Claude handles all the orchestration automatically."}
                    ]
                }
            ]
        };
        // ============================================
        // END VIDEO DATA
        // ============================================

        // App State
        let currentCard = 0;
        const totalCards = VIDEO_DATA.cards.length;

        // DOM Elements
        const progress = document.getElementById('progress');
        const channelAvatar = document.getElementById('channelAvatar');
        const channelName = document.getElementById('channelName');
        const videoTitle = document.getElementById('videoTitle');
        const cardsWrapper = document.getElementById('cardsWrapper');
        const navLeft = document.getElementById('navLeft');
        const navRight = document.getElementById('navRight');
        const watchButton = document.getElementById('watchButton');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTerm = document.getElementById('modalTerm');
        const modalType = document.getElementById('modalType');
        const modalContent = document.getElementById('modalContent');
        const modalClose = document.getElementById('modalClose');
        const swipeHint = document.getElementById('swipeHint');

        // Initialize
        function init() {
            channelAvatar.textContent = VIDEO_DATA.channelName.charAt(0).toUpperCase();
            channelName.textContent = VIDEO_DATA.channelName;
            videoTitle.textContent = VIDEO_DATA.title;
            document.title = `iTabs | ${VIDEO_DATA.title}`;
            
            watchButton.href = `https://www.youtube.com/watch?v=${VIDEO_DATA.videoId}`;

            for (let i = 0; i < totalCards; i++) {
                const segment = document.createElement('div');
                segment.className = 'progress-segment';
                progress.appendChild(segment);
            }

            VIDEO_DATA.cards.forEach((card, index) => {
                const cardEl = createCard(card, index);
                cardsWrapper.insertBefore(cardEl, navLeft);
            });

            updateCard(0);

            navLeft.addEventListener('click', () => navigate(-1));
            navRight.addEventListener('click', () => navigate(1));
            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') navigate(-1);
                if (e.key === 'ArrowRight') navigate(1);
                if (e.key === 'Escape') closeModal();
            });

            let touchStartX = 0;
            cardsWrapper.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
            });
            cardsWrapper.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 50) {
                    navigate(diff > 0 ? 1 : -1);
                }
            });

            [navLeft, navRight].forEach(el => {
                el.addEventListener('click', () => {
                    swipeHint.classList.add('hidden');
                }, { once: true });
            });
        }

        function createCard(card, index) {
            const cardEl = document.createElement('div');
            cardEl.className = 'card';
            cardEl.dataset.index = index;

            const thumbnailUrl = `https://img.youtube.com/vi/${VIDEO_DATA.videoId}/maxresdefault.jpg`;
            const timestampUrl = `https://www.youtube.com/watch?v=${VIDEO_DATA.videoId}&t=${card.timestampSeconds}s`;

            let iButtonsHTML = '';
            if (card.iButtons && card.iButtons.length > 0) {
                const buttons = card.iButtons.map(btn => {
                    const label = btn.term || (btn.type === 'why-it-matters' ? 'Why it matters' : btn.type);
                    return `<button class="i-button" data-type="${btn.type}" data-term="${btn.term || ''}" data-content="${encodeURIComponent(btn.content)}">
                        <span class="i-icon">i</span>
                        ${label}
                    </button>`;
                }).join('');
                iButtonsHTML = `<div class="i-buttons">${buttons}</div>`;
            }

            cardEl.innerHTML = `
                <div class="card-content">
                    <div class="card-thumbnail">
                        <img src="${thumbnailUrl}" alt="Video thumbnail" onerror="this.style.display='none'">
                        <a href="${timestampUrl}" target="_blank" class="timestamp-badge">▶ ${card.timestamp}</a>
                    </div>
                    <div class="card-body">
                        <div class="card-number">Key Point ${index + 1} of ${totalCards}</div>
                        <h2 class="card-headline">${card.headline}</h2>
                        <p class="card-summary">${card.summary}</p>
                        ${iButtonsHTML}
                    </div>
                </div>
            `;

            cardEl.querySelectorAll('.i-button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openModal(
                        btn.dataset.term || getTypeLabel(btn.dataset.type),
                        btn.dataset.type,
                        decodeURIComponent(btn.dataset.content)
                    );
                });
            });

            return cardEl;
        }

        function getTypeLabel(type) {
            const labels = {
                'definition': 'Definition',
                'context': 'Context',
                'why-it-matters': 'Why It Matters',
                'related': 'Related'
            };
            return labels[type] || type;
        }

        function navigate(direction) {
            const newIndex = currentCard + direction;
            if (newIndex >= 0 && newIndex < totalCards) {
                updateCard(newIndex);
            }
        }

        function updateCard(index) {
            const cards = document.querySelectorAll('.card');
            const segments = document.querySelectorAll('.progress-segment');

            cards.forEach((card, i) => {
                card.classList.remove('active', 'prev');
                if (i === index) {
                    card.classList.add('active');
                } else if (i < index) {
                    card.classList.add('prev');
                }
            });

            segments.forEach((seg, i) => {
                seg.classList.remove('active', 'viewed');
                if (i === index) {
                    seg.classList.add('active');
                } else if (i < index) {
                    seg.classList.add('viewed');
                }
            });

            currentCard = index;
        }

        function openModal(term, type, content) {
            modalTerm.textContent = term;
            modalType.textContent = getTypeLabel(type);
            modalContent.textContent = content;
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
